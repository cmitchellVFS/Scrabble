org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
# Run Gradle in-process (no background daemon). On locked-down machines the
# daemon's loopback IPC socket can be blocked ("Unable to establish loopback
# connection"); running without a daemon avoids that socket entirely.
org.gradle.daemon=false
unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
