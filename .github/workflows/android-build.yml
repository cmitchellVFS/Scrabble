name: Build Android APK

# Builds the Scrabble Android APK on GitHub's runners (IL2CPP + ARM64), so the
# packaging step runs off the locked-down local machine whose endpoint security
# blocks the JVM loopback socket that Gradle needs.
#
# REQUIRED one-time setup — add a Unity license as repo secrets
# (Settings > Secrets and variables > Actions):
#   Personal (free) license:
#     - UNITY_LICENSE : the full contents of your Unity_v6000.x.ulf activation file
#       (get it by running the game-ci activation flow once: https://game.ci/docs/github/activation)
#   Pro / Plus license (instead of UNITY_LICENSE):
#     - UNITY_EMAIL, UNITY_PASSWORD, UNITY_SERIAL
#
# Then run it: Actions tab > "Build Android APK" > Run workflow. The signed
# (debug-keystore) APK is uploaded as the "ScrabbleUnity-Android-APK" artifact.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Server/**'
      - '.claude/**'
      - '**/*.md'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (IL2CPP / ARM64)
    runs-on: ubuntu-latest
    steps:
      # Unity Android images are large; reclaim host disk before the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "/usr/local/lib/android/sdk/ndk" || true
          sudo docker image prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # Cache the imported Library to make repeat builds much faster.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          # Unity version + scripting backend (IL2CPP), ABI (ARM64), orientation
          # and app id all come from the committed ProjectSettings — no overrides.
          targetPlatform: Android
          androidExportType: androidPackage   # .apk (not .aab)
          allowDirtyBuild: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrabbleUnity-Android-APK
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 30
