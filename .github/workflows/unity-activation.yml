name: Acquire Unity activation file (.alf)

# One-time helper to get a Unity Personal license working in CI.
# Steps:
#   1. Run this workflow (Actions > "Acquire Unity activation file" > Run workflow).
#   2. Download the "Unity-activation-file" artifact it produces (a .alf file).
#   3. Go to https://license.unity3d.com/manual, upload the .alf, and download
#      the resulting .ulf license file.
#   4. Add the FULL contents of that .ulf as a repo secret named UNITY_LICENSE
#      (Settings > Secrets and variables > Actions > New repository secret).
#   5. Run the "Build Android APK" workflow.

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request .alf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        # Unity version is auto-detected from ProjectSettings/ProjectVersion.txt

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-activation-file
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          if-no-files-found: error
